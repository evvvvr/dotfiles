# ~/.config/starship.toml  (stow: dotfiles/starship/.config/starship.toml)

format = """
$directory\
$git_branch\
$git_status\
$aws\
$kubernetes\
$docker_context\
$terraform\
$cmd_duration\
$line_break\
$character"""

add_newline = true

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"

# --- Git branch ---
[git_branch]
symbol = "󰘬 "
style = "bold purple"
format = "[$symbol$branch]($style) "

# --- Git status: shows dirty/staged/ahead-behind ---
[git_status]
style = "bold yellow"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "≡${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# --- Node version (shows only in JS/TS projects) ---
[nodejs]
symbol = " "
style = "bold green"
format = '([$symbol($version )]($style))'

# --- Python version (shows only in Python projects/venvs) ---
[python]
symbol = " "
style = "dimmed white"
format = '([$virtualenv ]($style))'

[aws]
symbol = "☁ "
style = "bold yellow"
format = '([$symbol$profile(\($region\))]($style) )'

[kubernetes]
symbol = "⎈ "
style = "bold blue"
format = '([$symbol$context(\($namespace\))]($style) )'
disabled = false

[docker_context]
symbol = "🐳 "
style = "bold blue"
format = '([$symbol$context]($style) )'

[terraform]
symbol = "󱁢 "
style = "bold purple"
format = '([$symbol$workspace]($style) )'

[cmd_duration]
min_time = 2000
style = "dimmed yellow"
format = '(took [$duration]($style) )'

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"